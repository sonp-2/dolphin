[package]
name = "dolphin"
version = "0.57.0"
edition = "2024"
# let chains（`if let ... && ...`）を使っているので 1.88 以上。既定の feature の依存も 1.88 で足りる
rust-version = "1.88"
description = "Dolphin: Rust 製のインタプリタ言語（VM・async/await・標準ライブラリ・LSP・フォーマッタ付き）"
license = "MIT"
repository = "https://github.com/sonp-2/dolphin"
readme = "README.md"
keywords = ["interpreter", "language", "scripting", "vm", "lsp"]
categories = ["compilers", "command-line-utilities", "development-tools"]

# コア言語（lib）は外部クレートに依存しない。CLI の便利機能だけ feature で足す
[dependencies]
# ハッシュ・HMAC・乱数（std:crypto）。暗号は自前で書かず、既存の実装を使う
md-5 = { version = "0.11", optional = true }
ring = { version = "0.17", optional = true }
regex = { version = "1", optional = true }
rustyline = { version = "18.0.1", optional = true }
# 音の再生（`import["std:audio"]`）。Linux では ALSA の開発用ファイルが要る
rodio = { version = "0.23", optional = true, default-features = false, features = ["playback", "wav", "flac", "mp3", "vorbis"] }
# SQLite（`import["std:sqlite"]`）。ソースを同梱してビルドする（C コンパイラが要る）
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
# 画像のデコード（`std:canvas` の `image`）
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# C の共有ライブラリを呼ぶ（`import["std:ffi"]`）。呼び出し規約は libffi に任せる
libloading = { version = "0.8", optional = true }
libffi = { version = "5", optional = true }
# GUI（`import["std:ui"]`）。OpenGL（glow）で描く
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
# HTTP クライアント（std:http）。TLS は rustls
ureq = { version = "3.4", optional = true }
# WebSocket の TLS（`wss://`）。ルート証明書は std:http と同じ webpki-roots
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
# PostgreSQL（`import["std:postgres"]`）。純 Rust の同期クライアント。TLS は rustls（`tls` feature と同じ webpki-roots）
postgres = { version = "0.19", optional = true, default-features = false }
postgres-protocol = { version = "0.6", optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false, features = ["ring"] }
bytes = { version = "1", optional = true }
fallible-iterator = { version = "0.2", optional = true }
# YAML（`import["std:yaml"]`）。パーサーのイベントを読み、値は自前で組み立てる
yaml-rust2 = { version = "0.13", optional = true }
# TOML（`import["std:toml"]`）。キーの順を保つ
toml = { version = "1", optional = true, default-features = false, features = ["parse", "display", "serde", "preserve_order"] }
# 圧縮とアーカイブ（`import["std:zip"]`）。どれも純 Rust
flate2 = { version = "1", optional = true }
zip = { version = "9", optional = true, default-features = false, features = ["deflate-flate2"] }
tar = { version = "0.4", optional = true, default-features = false }

[features]
default = ["repl", "http", "crypto", "regex", "tls", "image"]
# REPL の行編集（矢印キー・履歴）。wasm 版などでは外す
repl = ["dep:rustyline"]
# HTTP クライアント（`import["std:http"]`）。外すと TLS などの依存がビルドに入らない
http = ["dep:ureq"]
# WebSocket の TLS（`wss://`）
tls = ["dep:rustls", "dep:webpki-roots"]
# ハッシュ・HMAC・乱数（`import["std:crypto"]`）
crypto = ["dep:ring", "dep:md-5"]
# 正規表現（`import["std:regex"]`）
regex = ["dep:regex"]
# GUI（`import["std:ui"]`）。依存が多くビルドが重いので、既定では無効（`--features ui`）
ui = ["dep:eframe", "image"]
# 画像の加工（`import["std:image"]`）。`ui` feature にも含まれる
image = ["dep:image"]
# 音の再生（`import["std:audio"]`）。既定では無効（`--features audio`）
audio = ["dep:rodio"]
# C の共有ライブラリを呼ぶ（`import["std:ffi"]`）。unsafe を使う。既定では無効（`--features ffi`）
ffi = ["dep:libloading", "dep:libffi"]
# SQLite（`import["std:sqlite"]`）。ソースを同梱するのでビルドが長くなる。既定では無効（`--features sqlite`）
sqlite = ["dep:rusqlite"]
# PostgreSQL（`import["std:postgres"]`）。`tls` を含む。既定では無効（`--features postgres`）
postgres = ["dep:postgres", "dep:postgres-protocol", "dep:tokio-postgres-rustls", "dep:bytes", "dep:fallible-iterator", "tls"]
# YAML（`import["std:yaml"]`）。純 Rust。既定では無効（`--features yaml`）
yaml = ["dep:yaml-rust2"]
# TOML（`import["std:toml"]`）。純 Rust。既定では無効（`--features toml`）
toml = ["dep:toml"]
# gzip・zlib・zip・tar（`import["std:zip"]`）。純 Rust。既定では無効（`--features zip`）
zip = ["dep:flate2", "dep:zip", "dep:tar"]
